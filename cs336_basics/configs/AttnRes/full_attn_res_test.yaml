model_opt_config:
  model_architecture: full_attn_res   # ["std_Transformer", "full_attn_res", "block_attn_res"]
  vocab_size: 50257
  d_model: 512
  d_ff: 1344
  num_heads: 16
  num_layers: 4
  context_length: 256
  theta: 10000.0
  max_lr: 5.0e-3
  betas: [0.9, 0.99]
  weight_decay: 1.0e-5
  use_layer_norm: True

training:
  warmup_ratio: 0.1
  cosine_ratio: 0.9
  batch_size: 64
  
data:
  train_data_path: "../data/TinyStoriesV2-GPT4-train.npy"
  val_data_path: "../data/TinyStoriesV2-GPT4-valid.npy"
  sample_length: 256

wandb_logging:
  use_wandb: True
  wandb_team: "cs336_assign1"
  wandb_project: "full_attn_res"
  wandb_run: "base"
  config:
    max_learning_rate: 5.0e-3
    model_size: "test model"
