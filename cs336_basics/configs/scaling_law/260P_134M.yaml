model_opt_config:
  model_architecture: std_Transformer   # ["std_Transformer", "full_attn_res", "block_attn_res"]
  vocab_size: 50257
  d_model: 768
  d_ff: 2048
  num_heads: 16
  num_layers: 8
  context_length: 512
  theta: 10000.0
  max_lr: 2.0e-4
  betas: [0.9, 0.99]
  weight_decay: 1.0e-5
  use_layer_norm: True

training:
  warmup_ratio: 0.1
  cosine_ratio: 0.9
  batch_size: 64
  use_grad_clip: True
  grad_clipping: 1.0
  compute_flops: 2.6e17
  
data:
  train_data_path: "../data/owt_train.npy"
  val_data_path: "../data/owt_valid.npy"
  sample_length: 512

wandb_logging:
  use_wandb: True
  wandb_team: "cs336_assign1"
  wandb_project: "scaling_law"
  wandb_run: "C_260P_N_134M"
  config:
    max_learning_rate: 2.0e-4
    model_size: "134M"
